name: Build & Release DuitKu Android

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "manifest.webmanifest"
      - "icon.svg"
      - "service-worker.js"
      - "package.json"
      - "capacitor.config.json"
      - "scripts/**"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Isi versi rilis stabil, misalnya v1.1.0. Kosongkan untuk build APK tanpa menerbitkan release."
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [[ -z "$SDK_MANAGER" ]]; then
            echo "Android SDK command-line tools were not found."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDK_MANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare web assets
        run: npm run build:web

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Publish stable GitHub Release
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.release_version != '') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-release]')) }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.event_name == 'push' && 'v1.1.0' || inputs.release_version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Use a stable version such as v1.1.0"
            exit 1
          fi

          if gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_VERSION already exists."
            exit 1
          fi

          cat > release-notes.md <<'NOTES'
          ## DuitKu 1.1.0

          Pembaruan besar untuk pengelolaan keuangan harian.

          - Navigasi berbasis halaman: Ringkasan, Transaksi, Catat transaksi, Dompet, dan Laporan.
          - Saldo dipisahkan antara M-Banking/digital dan Cash/tunai.
          - Form transaksi memungkinkan pengguna memilih dompet sumber dana.
          - Ekspor laporan Excel (.xls) berisi lembar transaksi dan ringkasan saldo.
          - Identitas visual, logo, dan antarmuka diperbarui dengan gaya emerald premium.
          - Data transaksi tetap disimpan secara lokal di perangkat; tidak ada sinkronisasi cloud.
          - Paket Android ini dibangun menggunakan varian debug, bukan paket produksi Play Store.
          - Agar pembaruan dapat menimpa instalasi lama, APK perlu ditandatangani dengan keystore yang sama.
          - Cadangkan data transaksi sebelum mengganti instalasi apabila Android meminta pemasangan yang tidak mempertahankan data.
          NOTES

          gh release create "$RELEASE_VERSION" "android/app/build/outputs/apk/debug/app-debug.apk#DuitKu-$RELEASE_VERSION.apk" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "DuitKu $RELEASE_VERSION" --notes-file release-notes.md

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuitKu-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
