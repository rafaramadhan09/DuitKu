name: Build & Release DuitKu Android

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "app-bootstrap.js"
      - "update.json"
      - "manifest.webmanifest"
      - "icon.svg"
      - "service-worker.js"
      - "package.json"
      - "capacitor.config.json"
      - "scripts/**"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Isi versi rilis stabil, misalnya v1.6.0. Kosongkan untuk build APK tanpa menerbitkan release."
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [[ -z "$SDK_MANAGER" ]]; then
            echo "Android SDK command-line tools were not found."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDK_MANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare web assets
        run: npm run build:web

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply DuitKu Android launcher branding
        run: node scripts/apply-android-branding.mjs

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check app-bootstrap.js
          node --check scripts/copy-web.mjs
          node --check scripts/apply-android-branding.mjs
          node scripts/test-finance-logic.mjs
          node - <<'NODE'
          const fs = require("node:fs");
          const vm = require("node:vm");
          const source = fs.readFileSync("app.js", "utf8");
          const start = source.indexOf("  function isValidDateString(value) {");
          const close = source.indexOf(String.fromCharCode(10) + "  }", start);
          if (start < 0 || close < 0) throw new Error("Date validation helper missing");
          const helper = source.slice(start, close + 4);
          function localDateString(date) {
            return date.getFullYear() + "-" +
              String(date.getMonth() + 1).padStart(2, "0") + "-" +
              String(date.getDate()).padStart(2, "0");
          }
          const validate = vm.runInNewContext("(" + helper.trim() + ")", { localDateString });
          for (const value of ["2026-11-25", "2024-02-29"]) {
            if (!validate(value)) throw new Error("Expected valid date: " + value);
          }
          for (const value of ["2026-02-30", "2026-2-5", "not-a-date", ""]) {
            if (validate(value)) throw new Error("Expected invalid date: " + value);
          }
          console.log("Date validation smoke tests passed.");
          NODE

      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: duitku-android-debug-signing-key-v1

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Publish stable GitHub Release
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.release_version != '') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-release]')) }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION_INPUT: ${{ inputs.release_version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            RELEASE_VERSION="$RELEASE_VERSION_INPUT"
          else
            RELEASE_VERSION="v$(node -p "require('./package.json').version")"
          fi

          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Use a stable version such as v1.6.0"
            exit 1
          fi

          cat > release-notes.md <<NOTES
          ## DuitKu ${RELEASE_VERSION}

          Pembaruan keandalan penyimpanan, pencadangan/pemulihan data, ekspor Excel, dan penyempurnaan riwayat.

          - Cadangkan seluruh transaksi ke JSON dan pulihkan cadangan dari pemilih file Android atau browser.
          - Data lokal yang tidak valid tidak lagi ditimpa diam-diam; aplikasi memberi peringatan dan menunggu pemulihan.
          - Ekspor Excel memakai jembatan file Android yang diperkuat dan membersihkan karakter XML yang tidak valid.
          - Riwayat dapat difilter berdasarkan transfer dan pencarian mencakup tanggal serta dompet.
          - Rasio sisa uang pada dashboard dibatasi agar sesuai dengan indikator melingkar.
          - Transfer antar-dompet tetap tidak dihitung sebagai pemasukan atau pengeluaran.
          - Update fitur HTML/CSS/JavaScript tetap diterapkan dari dalam DuitKu; perubahan native membutuhkan APK.
          - Data transaksi tetap berada di perangkat kecuali pengguna sendiri mengekspor file cadangan.
          NOTES

          if ! gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "DuitKu $RELEASE_VERSION" --notes-file release-notes.md --draft
          fi

          cp android/app/build/outputs/apk/debug/app-debug.apk "DuitKu-$RELEASE_VERSION.apk"
          gh release upload "$RELEASE_VERSION" "DuitKu-$RELEASE_VERSION.apk" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --title "DuitKu $RELEASE_VERSION" --notes-file release-notes.md --draft=false

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuitKu-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
